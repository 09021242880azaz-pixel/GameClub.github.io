<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>GAME CLUB — مدیریت</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body data-page="admin">
  <div class="app">
    <aside id="rail" class="rail glass"></aside>
    <div class="content">
      <header class="topbar" style="justify-content:flex-end">
        <select id="lang" class="lang glass" aria-label="language"></select>
      </header>
      <div id="notice" class="notice hidden"></div>

      <!-- ورود مدیر -->
      <section id="view-login" class="glass login">
        <h2>ورود مدیر</h2>
        <form id="login-form">
          <label>ایمیل<input type="email" name="email" required autocomplete="username"></label>
          <label>رمز عبور<input type="password" name="password" required autocomplete="current-password"></label>
          <button class="btn" type="submit">ورود</button>
        </form>
      </section>

      <!-- داشبورد -->
      <div id="view-dash" class="hidden">
        <div class="dash-top">
          <h1>داشبورد مدیریت</h1>
          <span class="muted" id="who"></span>
          <button class="btn ghost sm" id="logout" type="button">خروج</button>
        </div>

        <section class="stats" id="stats"></section>

        <div class="admin-grid">
          <div class="glass section">
            <h2>دسته‌بندی‌ها</h2>
            <div id="cat-stats"></div>
          </div>
          <div class="glass section">
            <h2>لوگوی سایت</h2>
            <div id="logo-preview" class="logo-preview"></div>
            <input type="file" id="logo-file" accept="image/*">
          </div>
        </div>

        <section class="glass section">
          <div class="section-head">
            <h2>بازی‌ها</h2>
            <button class="btn ghost sm" id="new-game" type="button">+ بازی جدید</button>
          </div>
          <div style="overflow-x:auto">
            <table>
              <thead><tr><th>عنوان</th><th>ژانر</th><th>امتیاز</th><th>ویژه</th><th>محبوب</th><th></th></tr></thead>
              <tbody id="games-table"></tbody>
            </table>
          </div>
        </section>

        <section class="glass section" id="game-section">
          <h2 id="form-title">بازی جدید</h2>
          <form id="game-form" class="form-grid">
            <label>عنوان<input name="title" required></label>
            <label>سازنده<input name="developer"></label>
            <label>سال انتشار<input name="release_year" type="number"></label>
            <label>ژانر (متن)<input name="genre"></label>
            <label>امتیاز (۰ تا ۵)<input name="rating" type="number" step="0.1" min="0" max="5"></label>
            <label>حجم دانلود<input name="download_size" placeholder="مثلاً 45 GB"></label>
            <label class="full">پلتفرم‌ها (با ویرگول جدا کنید)<input name="platforms" placeholder="PC, PS5"></label>

            <div class="full">
              <span class="field-label">دسته‌بندی‌ها</span>
              <div class="chips" id="form-cats" style="margin-bottom:14px"></div>
            </div>

            <label class="full">توضیحات<textarea name="description" rows="4"></textarea></label>

            <label>آدرس کاور<input name="cover_url"></label>
            <label>آپلود کاور<input type="file" id="cover-file" accept="image/*"></label>
            <label>آدرس ویدیو (یوتیوب یا فایل)<input name="video_url"></label>
            <label>آپلود ویدیو<input type="file" id="video-file" accept="video/mp4,video/webm"></label>
            <label class="full">گالری (هر آدرس در یک خط)<textarea name="gallery" rows="3"></textarea></label>
            <label>آپلود تصاویر گالری<input type="file" id="gallery-file" accept="image/*" multiple></label>
            <label>لینک فروشگاه رسمی<input name="official_store_url"></label>
            <label>لینک دانلود<input name="download_url"></label>

            <div class="full">
              <span class="field-label">حداقل نیازمندی‌ها</span>
              <div class="form-grid">
                <label>سیستم‌عامل<input name="min_os"></label>
                <label>پردازنده<input name="min_cpu"></label>
                <label>کارت گرافیک<input name="min_gpu"></label>
                <label>رم (GB)<input name="min_ram_gb" type="number" min="0"></label>
                <label>فضای ذخیره‌سازی (GB)<input name="min_storage_gb" type="number" min="0"></label>
              </div>
            </div>

            <div class="full">
              <span class="field-label">توصیه‌شده</span>
              <div class="form-grid">
                <label>سیستم‌عامل<input name="rec_os"></label>
                <label>پردازنده<input name="rec_cpu"></label>
                <label>کارت گرافیک<input name="rec_gpu"></label>
                <label>رم (GB)<input name="rec_ram_gb" type="number" min="0"></label>
                <label>فضای ذخیره‌سازی (GB)<input name="rec_storage_gb" type="number" min="0"></label>
              </div>
            </div>

            <label><input type="checkbox" name="is_featured"> بنر ویژه صفحه اصلی</label>
            <label><input type="checkbox" name="is_popular"> محبوب</label>

            <div class="full" style="display:flex;gap:10px;flex-wrap:wrap">
              <button class="btn" type="submit">ذخیره</button>
              <button class="btn ghost" type="button" id="cancel-edit">انصراف</button>
            </div>
          </form>
        </section>

        <section class="glass section">
          <h2>پلتفرم‌های دیگر</h2>
          <form id="social-form" class="form-grid">
            <label>نوع
              <select name="platform">
                <option value="instagram">اینستاگرام</option>
                <option value="youtube">یوتیوب</option>
                <option value="rubika">روبیکا</option>
                <option value="telegram">تلگرام</option>
                <option value="custom">لینک سفارشی</option>
              </select>
            </label>
            <label>عنوان<input name="title"></label>
            <label class="full">آدرس (با http یا https)<input name="url" type="url" required></label>
            <label>ترتیب نمایش<input name="sort_order" type="number" value="0"></label>
            <label><input type="checkbox" name="enabled" checked> فعال</label>
            <div class="full"><button class="btn" type="submit">افزودن لینک</button></div>
          </form>
          <div style="overflow-x:auto;margin-top:14px">
            <table>
              <thead><tr><th>نوع</th><th>عنوان</th><th>آدرس</th><th>ترتیب</th><th>وضعیت</th><th></th></tr></thead>
              <tbody id="social-table"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </div>
  <nav id="mnav" class="mobile-nav glass"></nav>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="i18n.js"></script>
  <script src="i18n-extra.js"></script>
  <script src="app.js"></script>
  <script src="admin.js"></script>
</body>
</html>
